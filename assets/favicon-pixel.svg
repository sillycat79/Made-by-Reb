<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" role="img" aria-label="Cute pixel favicon" style="shape-rendering:crispEdges;">
  <!-- Soft pink background -->
  <rect width="16" height="16" fill="#fff1f2"/>
  <!-- Cheeks -->
  <rect x="3" y="6" width="1" height="1" fill="#ffb4c6"/>
  <rect x="12" y="6" width="1" height="1" fill="#ffb4c6"/>
  <!-- Eyes -->
  <rect x="5" y="5" width="1" height="1" fill="#0f172a"/>
  <rect x="10" y="5" width="1" height="1" fill="#0f172a"/>
  <!-- Mouth (smile) -->
  <rect x="5" y="9" width="1" height="1" fill="#0f172a"/>
  <rect x="6" y="10" width="1" height="1" fill="#0f172a"/>
  <rect x="7" y="10" width="1" height="1" fill="#0f172a"/>
  <rect x="8" y="10" width="1" height="1" fill="#0f172a"/>
  <rect x="9" y="10" width="1" height="1" fill="#0f172a"/>
  <rect x="10" y="9" width="1" height="1" fill="#0f172a"/>
  <!-- Border for crisp look -->
  <rect x="0" y="0" width="16" height="16" fill-opacity="0" stroke="#00000000"/>
</svg>
